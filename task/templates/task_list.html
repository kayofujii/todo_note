{% extends 'base.html' %}

{% block content %}
    <div class="mt-5">
        {% for t in task %}
        <div class="card mb-2">
            <div class="card-body">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox">
                    <label class="form-check-label">
                        {{ t.title }}
                    </label>
                    <button type="button" class="close float-right">
                        <span>&times;</span>
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
